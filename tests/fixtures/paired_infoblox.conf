option domain-name "example.com";
default-lease-time 86400;

class "PhoneVendor" {
   match if (option vendor-class-identifier="PhoneVendor");
   option ntp-servers 10.0.0.2;
}

subnet 10.99.0.0 netmask 255.255.255.0 {
   option routers 10.99.0.1;
   option domain-name-servers 10.0.0.1;
   pool {
      range 10.99.0.10 10.99.0.100;
   }
   host phone-reservation {
      hardware ethernet aa:bb:cc:dd:ee:ff;
      fixed-address 10.99.0.50;
      option routers 10.99.0.1;
      option domain-name-servers 10.0.0.1;
   }
}
