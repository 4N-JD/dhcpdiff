# Synthetic BlueCat-shaped markers only (no real site data).
dont-use-fsync true;
ping-check true;
server-id-check true;

option space VendorX;
option VendorX.item code 1 = text;

class "PXE" {
    match substring (option vendor-class-identifier, 0, 9) = "PXEClient";
}

subnet 10.0.0.0 netmask 255.255.255.0 {
    pool {
        range 10.0.0.10 10.0.0.20;
    }
}
