server-identifier qip-test;

subnet 10.99.0.0 netmask 255.255.255.0 {
   dynamic-dhcp range 10.99.0.10 10.99.0.100 {
      option routers 10.99.0.1;
      option domain-name-servers 10.0.0.1;
      option domain-name "example.com";
      option dhcp-lease-time 86400;
   }
   manual-dhcp aa-bb-cc-dd-ee-ff 10.99.0.50 {
      option routers 10.99.0.1;
      option domain-name-servers 10.0.0.1;
   }
   vendor-class "PhoneVendor" {
      option ntp-servers 10.0.0.2;
   }
}
