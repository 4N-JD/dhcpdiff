# Synthetic Infoblox-shaped markers with vendor option spaces (no real site data).
option space VendorA;
option VendorA.one code 1 = text;
option space VendorB;
option VendorB.two code 2 = text;
option space VendorC;
option VendorC.three code 3 = unsigned integer 8;

option domain-name "example.test";

subnet 10.0.0.0 netmask 255.255.255.0 {
    pool {
        infoblox-range 10.0.0.10 10.0.0.20;
        range 10.0.0.10 10.0.0.20;
    }
}
