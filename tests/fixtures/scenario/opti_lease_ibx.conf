default-lease-time 43200;

option space OptiIpPhone;
option OptiIpPhone.DeploymentServer code 3 = text;

if (option vendor-class-identifier="OptiIpPhone") {
    vendor-option-space OptiIpPhone;
    option OptiIpPhone.DeploymentServer "sdlp://b.example:18443";
}

subnet 10.0.0.0 netmask 255.255.255.0 {
    host client1 {
        hardware ethernet aa:bb:cc:dd:ee:01;
        fixed-address 10.0.0.15;
    }
}
