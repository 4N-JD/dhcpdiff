class "PXE-Match"
{
    match substring (option vendor-class-identifier, 0, 20);
}

subclass "PXE-Match" "PXEClient:Arch:00009"
{
    default-lease-time 86400;
    max-lease-time 86400;
    min-lease-time 86400;
    next-server 1.2.3.4;
    option tftp-server-name "1.2.3.4";
    option bootfile-name "SMSBoot\\x64\\wdsmgfw.efi";
}

subnet 10.0.0.0 netmask 255.255.255.0
{
    default-lease-time 3600;
    max-lease-time 3600;
    min-lease-time 3600;
    pool
    {
        range 10.0.0.10 10.0.0.20;
    }
}
