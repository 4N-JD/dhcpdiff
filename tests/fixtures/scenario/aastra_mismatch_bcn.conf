option space AastraIPPhone;
option AastraIPPhone.cfg-server-name code 2 = text;
option AastraIPPhone.contact-rcs code 3 = boolean;

if option vendor-class-identifier = "AastraIPPhone"
{
    vendor-option-space AastraIPPhone;
}

option AastraIPPhone.cfg-server-name "http://10.253.204.102/aastra68xxi/";
option AastraIPPhone.contact-rcs false;

subnet 192.168.167.0 netmask 255.255.255.0 {
    option domain-name "pka.bankenit.de";
    option routers 192.168.167.1;
    host client {
        hardware ethernet 46:e4:e6:cd:f8:00;
        fixed-address 192.168.167.219;
        option domain-name "pka.bankenit.de";
    }
}
