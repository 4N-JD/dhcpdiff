option space Microsoft-Windows-Options;
option Microsoft-Windows-Options.Microsoft_Disable_Netbios_Option code 1 = unsigned integer 32;

class "Vendor-Microsoft-Windows-Options" {
	match if (option vendor-class-identifier="MSFT 5.0");
	vendor-option-space Microsoft-Windows-Options;
}

option Microsoft-Windows-Options.Microsoft_Disable_Netbios_Option 2;

subnet 10.0.0.0 netmask 255.255.255.0 {
    option routers 10.0.0.1;
    pool {
        range 10.0.0.10 10.0.0.20;
    }
}
