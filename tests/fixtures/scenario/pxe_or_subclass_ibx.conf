if (substring(option vendor-class-identifier,0,20)="PXEClient:Arch:00007" OR substring(option vendor-class-identifier,0,20)="PXEClient:Arch:00009") {
	default-lease-time 86400;
	min-lease-time 86400;
	max-lease-time 86400;
	option tftp-server-name "1.2.3.4";
	option bootfile-name "SMSBoot\x5cx64\x5cwdsmgfw.efi";
	next-server 1.2.3.4;
}

subnet 10.0.0.0 netmask 255.255.255.0 {
	default-lease-time 3600;
	min-lease-time 3600;
	max-lease-time 3600;
	pool {
		range 10.0.0.10 10.0.0.20;
	}
}
