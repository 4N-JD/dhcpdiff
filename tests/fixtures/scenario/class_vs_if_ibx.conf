option space AastraIPPhone;
option AastraIPPhone.cfg-server-name code 2 = text;

class "AastraIPPhone" {
    match if (option vendor-class-identifier="AastraIPPhone");
    vendor-option-space AastraIPPhone;
    option AastraIPPhone.cfg-server-name "http://cfg.example/aastra";
}

subnet 10.0.0.0 netmask 255.255.255.0 {
    option routers 10.0.0.1;
    pool {
        range 10.0.0.10 10.0.0.20;
    }
    host client1 {
        hardware ethernet aa:bb:cc:dd:ee:01;
        fixed-address 10.0.0.15;
    }
}
