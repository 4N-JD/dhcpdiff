option space MSFT50;
option MSFT50.Microsoft-Disable-Netbios-Option code 1 = unsigned integer 32;

if option vendor-class-identifier = "MSFT 5.0"
{
    vendor-option-space MSFT50;
}

option MSFT50.Microsoft-Disable-Netbios-Option 2;

subnet 10.0.0.0 netmask 255.255.255.0 {
    option routers 10.0.0.1;
    pool {
        range 10.0.0.10 10.0.0.20;
    }
}
