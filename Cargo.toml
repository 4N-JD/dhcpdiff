[package]
name = "dhcpdiff"
version = "0.2.0"
edition = "2021"
description = "Multi-vendor DHCP configuration diff tool"
license = "MIT"

[features]
default = ["vendor-qip", "vendor-infoblox", "vendor-bluecat", "vendor-microsoft"]
vendor-qip = []
vendor-infoblox = []
vendor-bluecat = []
vendor-microsoft = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ipnet = { version = "2", features = ["serde"] }
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
similar = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
